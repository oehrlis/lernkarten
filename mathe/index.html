<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:#f2f4f7;color:#1d2733;
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
header{background:#2e8540;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1}
header a,header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:7px 11px;
 font-size:15px;text-decoration:none}
main{padding:14px;max-width:560px;margin:0 auto}
.deck{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:4px;
 border:0;border-left:6px solid var(--c);box-shadow:0 1px 3px rgba(0,0,0,.08);width:100%;font-size:17px;
 text-align:left;color:inherit}
.deck b{flex:1}.deck small{color:#6b7783;font-size:13px;white-space:nowrap}
.deck.neutral{background:#6b7783;color:#fff}
.bar{height:6px;background:#dde3ea;border-radius:3px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--c)}
.info{font-size:14px;color:#6b7783;text-align:center;margin:6px 0 10px}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.1);min-height:55vh;padding:30px 18px 18px;
 display:flex;flex-direction:column;justify-content:center;gap:12px;border-top:8px solid var(--c);position:relative;
 font-size:19px;line-height:1.45;overflow-wrap:anywhere}
.card .tag{position:absolute;top:10px;left:14px;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--c)}
.vorne{text-align:center;font-weight:600}
.trenn{border-top:2px dashed #dde3ea;margin:4px 0}
.hint{color:#9aa5b1;font-size:14px;text-align:center}
.btns{display:flex;gap:10px;margin-top:14px}
.btns button{flex:1;border:0;border-radius:14px;padding:18px 8px;font-size:19px;font-weight:700;color:#fff}
.nein{background:#e67e22}.ja{background:#2e8540}.grau{background:#6b7783}
.end{text-align:center;font-size:20px}.end .gross{font-size:44px;font-weight:800;color:#2e8540}
.ant{font-weight:800;color:var(--c);font-size:1.15em}
.warum{color:#6b7783;font-size:15px}
.schritt{display:flex;flex-direction:column;margin:4px 0}.schritt small{color:#6b7783;font-size:14px}
.card table{border-collapse:collapse;margin:0 auto}.card td{padding:2px 8px 2px 0;vertical-align:top}
.card svg{max-width:100%;height:auto}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 2px}.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}.h1{color:#1f6fd1;font-weight:bold}.h2{color:#2e8540;font-weight:bold}.h3{color:#7b3fa0;font-weight:bold}.vorne{font-size:24px}
</style></head><body>
