<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:#f2f4f7;color:#1d2733;
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
header{background:#2e8540;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1}
header a,header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:7px 11px;
 font-size:15px;text-decoration:none}
main{padding:14px;max-width:560px;margin:0 auto}
.deck{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:4px;

 text-align:left;color:inherit}
.deck b{flex:1}.deck small{color:#6b7783;font-size:13px;white-space:nowrap}
.deck.neutral{background:#6b7783;color:#fff}
.bar{height:6px;background:#dde3ea;border-radius:3px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--c)}
.info{font-size:14px;color:#6b7783;text-align:center;margin:6px 0 10px}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.1);min-height:55vh;padding:30px 18px 18px;
 display:flex;flex-direction:column;justify-content:center;gap:12px;border-top:8px solid var(--c);position:relative;
 font-size:19px;line-height:1.45;overflow-wrap:anywhere}
.card .tag{position:absolute;top:10px;left:14px;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--c)}
.vorne{text-align:center;font-weight:600}
.trenn{border-top:2px dashed #dde3ea;margin:4px 0}
.hint{color:#9aa5b1;font-size:14px;text-align:center}
.btns{display:flex;gap:10px;margin-top:14px}
.btns button{flex:1;border:0;border-radius:14px;padding:18px 8px;font-size:19px;font-weight:700;color:#fff}
.nein{background:#e67e22}.ja{background:#2e8540}.grau{background:#6b7783}
.end{text-align:center;font-size:20px}.end .gross{font-size:44px;font-weight:800;color:#2e8540}
.ant{font-weight:800;color:var(--c);font-size:1.15em}
.warum{color:#6b7783;font-size:15px}
.schritt{display:flex;flex-direction:column;margin:4px 0}.schritt small{color:#6b7783;font-size:14px}
.card table{border-collapse:collapse;margin:0 auto}.card td{padding:2px 8px 2px 0;vertical-align:top}
.card svg{max-width:100%;height:auto}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 2px}.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}.h1{color:#1f6fd1;font-weight:bold}.h2{color:#2e8540;font-weight:bold}.h3{color:#7b3fa0;font-weight:bold}.vorne{font-size:24px}.merke{color:#555;font-style:italic;font-size:.9em;border-left:3px solid #ccc;padding-left:8px}.skizze{display:block;margin:8px auto 0;width:auto;max-width:100%;height:auto;min-height:90px}.hinten p{margin:0 0 8px}.hinten ol,.hinten ul{margin:0;padding-left:22px;text-align:left}

span><small>Flugstrecke ist die Hypotenuse: plus<\/small><\/div><div class=\"schritt\"><span>√672'500 ≈ 820.06<\/span><small>Wurzel ziehen<\/small><\/div><div class=\"schritt\"><span>820.06 ≈ <span class=\"h2\">820<\/span><\/span><small>auf Zehner runden<\/small><\/div>"}, {"d": "pythagoras", "id": "pythagoras12-10", "f": "Formel 1: Eine Kamera-Drohne fliegt geradlinig vom Fahrerlager auf einen 180 m höheren Hügel. Auf der Streckenkarte (1:50'000) sind es 28 mm. Wie lang ist die Flugstrecke? Runde auf Zehner.", "b": "<div class=\"ant\">≈ 1'410 m<\/div><div class=\"schritt\"><span>28 · 50'000 = 1'400'000<\/span><small>Karte → Wirklichkeit in mm<\/small><\/div><div class=\"schritt\"><span>1'400'000 : 1'000 = <span class=\"h1\">1'400<\/span><\/span><small>mm → m: horizontale Distanz<\/small><\/div><div class=\"schritt\"><span>1'400² + 180² = 1'960'000 + 32'400 = 1'992'400<\/span><small>Flugstrecke ist die Hypotenuse: plus<\/small><\/div><div class=\"schritt\"><span>√1'992'400 ≈ 1'411.52<\/span><small>Wurzel ziehen<\/small><\/div><div class=\"schritt\"><span>1'411.52 ≈ <span class=\"h2\">1'410<\/span><\/span><small>auf Zehner runden<\/small><\/div>"}, {"d": "thales", "id": "tp1", "f": "<b>P 1<\/b> · Satz des Pythagoras:<br>Wie lautet er?", "b": "<p>In jedem <b>rechtwinkligen<\/b> Dreieck gilt:<br>Kathete² + Kathete² = Hypotenuse²<\/p><p style='text-align:center;font-size:1.2em'><b>a² + b² = c²<\/b><\/p><svg class=\"skizze\" viewBox=\"0 0 37 36\" width=\"36mm\" height=\"35mm\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"12,14 24,23 12,23\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\" stroke-width=\"0.8\"/><polygon points=\"12,23 24,23 24,35 12,35\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"#dbe8fb\"/><polygon points=\"12,14 12,23 3,23 3,14\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"#e6dcf3\"/><polygon points=\"12,14 24,23 33,11 21,2\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"#fde7cf\"/><path d=\"M 14.6 23 A 2.6 2.6 0 0 0 12 20.4\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\"/><circle cx=\"13.1\" cy=\"21.9\" r=\"0.4\" fill=\"#222\"/><text x=\"18\" y=\"30.5\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" >a²<\/text><text x=\"7.5\" y=\"20\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" >b²<\/text><text x=\"22.5\" y=\"13.5\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" >c²<\/text><\/svg>"}, {"d": "thales", "id": "tp2", "f": "<b>P 2<\/b> · Was ist die Hypotenuse,<br>was sind die Katheten?", "b": "<p><b>Hypotenuse<\/b>: liegt dem rechten Winkel <b>gegenüber<\/b>, immer die längste Seite.<br><b>Katheten<\/b>: die zwei Seiten am rechten Winkel.<\/p><svg class=\"skizze\" viewBox=\"0 0 50 30\" width=\"44mm\" height=\"26mm\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"8,24 44,24 8,4\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\" stroke-width=\"0.7\"/><path d=\"M 10.6 24 A 2.6 2.6 0 0 0 8 21.4\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\"/><circle cx=\"9.1\" cy=\"22.9\" r=\"0.4\" fill=\"#222\"/><text x=\"26\" y=\"28.5\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" >Kathete a<\/text><text x=\"4\" y=\"14\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" transform=\"rotate(-90 4 14)\">Kathete b<\/text><text x=\"30\" y=\"11.5\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" transform=\"rotate(29 30 11.5)\" font-weight=\"bold\">Hypotenuse c<\/text><\/svg>"}, {"d": "thales", "id": "tp3", "f": "<b>P 3<\/b> · Hypotenuse gesucht:<br>Wie rechnest du?", "b": "<p><b>c² = a² + b²<\/b> → <b>c = √(a² + b²)<\/b><\/p><p>Katheten 6 cm und 8 cm:<br>c² = 36 + 64 = 100<br>c = √100 = <b>10 cm<\/b><\/p><p class='merke'>Hypotenuse gesucht → plus<\/p>"}, {"d": "thales", "id": "tp4", "f": "<b>P 4<\/b> · Kathete gesucht:<br>Wie rechnest du?", "b": "<p><b>a² = c² − b²<\/b> → <b>a = √(c² − b²)<\/b><\/p><p>Hypotenuse 13 cm, Kathete 12 cm:<br>a² = 169 − 144 = 25<br>a = √25 = <b>5 cm<\/b><\/p><p class='merke'>Kathete gesucht → <b>minus<\/b>! Mit plus wird sie länger als die Hypotenuse.<\/p>"}, {"d": "thales", "id": "tp5", "f": "<b>P 5<\/b> · Ist ein Dreieck rechtwinklig?<br>(Umkehrung des Pythagoras)", "b": "<p>Die zwei kürzeren Seiten quadrieren und addieren, mit dem Quadrat der längsten vergleichen. Gleich gross → <b>rechtwinklig<\/b>.<\/p><p>9, 12, 15: 81 + 144 = 225 = 15² → <b>ja<\/b><br>5, 7, 9: 25 + 49 = 74, aber 9² = 81 → <b>nein<\/b><\/p>"}, {"d": "thales", "id": "tp6", "f": "<b>P 6<\/b> · Pythagoreische Zahlentripel:<br>Welche kennst du?", "b": "<p>Drei ganze Zahlen mit a² + b² = c²:<\/p><p><b>3 – 4 – 5<\/b><br><b>5 – 12 – 13<\/b><br><b>8 – 15 – 17<\/b><br><b>7 – 24 – 25<\/b><\/p><p class='merke'>Vielfache gelten auch: 6 – 8 – 10, 30 – 40 – 50, 1.5 – 2 – 2.5<\/p>"}, {"d": "thales", "id": "tp7", "f": "<b>P 7<\/b> · Wann darfst du Pythagoras brauchen?", "b": "<p><b>Nur im rechtwinkligen Dreieck.<\/b><\/p><p>In anderen Figuren zuerst ein rechtwinkliges Dreieck suchen: die <b>Diagonale<\/b> im Rechteck oder Quadrat, die <b>Höhe<\/b> im gleichseitigen oder gleichschenkligen Dreieck.<\/p>"}, {"d": "thales", "id": "tp8", "f": "<b>P 8<\/b> · Katheten 30 mm und 16 mm:<br>Wie lang ist die Hypotenuse?", "b": "<p>c² = 30² + 16² = 900 + 256 = 1'156<br>c = √1'156 = <b>34 mm<\/b><\/p><p class='merke'>Probe: 34 mm ist länger als beide Katheten.<\/p>"}, {"d": "thales", "id": "tp9", "f": "<b>P 9<\/b> · Hypotenuse 32.5 cm, Kathete 31.5 cm:<br>Wie lang ist die andere Kathete?", "b": "<p>b² = 32.5² − 31.5² = 1'056.25 − 992.25 = 64<br>b = √64 = <b>8 cm<\/b><\/p><p class='merke'>Kathete gesucht → minus.<\/p>"}, {"d": "thales", "id": "tp10", "f": "<b>T 10<\/b> · Satz des Thales:<br>Wie lautet er?", "b": "<p>Liegt der Punkt C auf dem <b>Halbkreis über AB<\/b>, dann hat das Dreieck ABC bei C einen <b>rechten Winkel<\/b> (90°).<\/p><svg class=\"skizze\" viewBox=\"0 0 40 25\" width=\"40mm\" height=\"25mm\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M 4 21 A 16 16 0 0 1 36 21\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\" stroke=\"#7b3fa0\"/><line x1=\"4\" y1=\"21\" x2=\"36\" y2=\"21\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\"/><polyline points=\"4,21 28,7.14 36,21\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\"/><polyline points=\"4,21 9.72,8.74 36,21\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\" stroke-dasharray=\"1 0.7\"/><circle cx=\"20\" cy=\"21\" r=\"0.5\" fill=\"#222\"/><text x=\"2.5\" y=\"24.5\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" >A<\/text><text x=\"37.5\" y=\"24.5\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" >B<\/text><text x=\"20\" y=\"24.5\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" >M<\/text><text x=\"29\" y=\"5.54\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" >C<\/text><text x=\"8.22\" y=\"7.140000000000001\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" >C'<\/text><text x=\"28\" y=\"10.739999999999998\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" font-size=\"5\">·<\/text><text x=\"10.020000000000001\" y=\"12.54\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" font-size=\"5\">·<\/text><\/svg>"}, {"d": "thales", "id": "tp11", "f": "<b>T 11<\/b> · Umkehrung des Thales:<br>Wo liegt der Mittelpunkt des Umkreises?", "b": "<p>In jedem rechtwinkligen Dreieck liegt die Ecke mit dem rechten Winkel auf dem Kreis über der Hypotenuse.<\/p><p>Mittelpunkt des Umkreises = <b>Mitte der Hypotenuse<\/b>, Radius = Hypotenuse : 2.<\/p>"}, {"d": "thales", "id": "tp12", "f": "<b>T 12<\/b> · Thaleskreis konstruieren:<br>Welche Schritte?", "b": "<ol><li>Strecke AB zeichnen.<\/li><li>Mittelpunkt M von AB (messen oder Mittelsenkrechte).<\/li><li>Kreis um M mit Radius r = AB : 2.<\/li><li>Jeder Punkt C auf dem Halbkreis gibt bei C einen rechten Winkel.<\/li><\/ol>"}, {"d": "thales", "id": "tp13", "f": "<b>T 13<\/b> · Gleichschenklig-rechtwinkliges Dreieck über AB:<br>Wo liegt C?", "b": "<p>Auf der <b>Mittelsenkrechten<\/b> von AB, wo sie den Thaleskreis schneidet: ganz oben auf dem Halbkreis.<\/p><p>Höhe h = AB : 2. Bei AB = 7.6 cm: h = <b>3.8 cm<\/b>.<\/p>"}, {"d": "thales", "id": "tp14", "f": "<b>T 14<\/b> · Rechtwinkliges Dreieck über AB mit Höhe h:<br>Wie findest du C?", "b": "<p>Thaleskreis über AB, dann eine <b>Parallele zu AB im Abstand h<\/b>. Die Schnittpunkte sind C und C': <b>zwei Lösungen<\/b>, spiegelbildlich.<\/p><svg class=\"skizze\" viewBox=\"0 0 40 25\" width=\"40mm\" height=\"25mm\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M 4 21 A 16 16 0 0 1 36 21\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\" stroke=\"#7b3fa0\"/><line x1=\"4\" y1=\"21\" x2=\"36\" y2=\"21\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\"/><line x1=\"1\" y1=\"12\" x2=\"39\" y2=\"12\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\" stroke=\"#138078\" stroke-dasharray=\"1.2 0.8\"/><polyline points=\"4,21 6.77,12 36,21\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\"/><polyline points=\"4,21 33.23,12 36,21\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\"/><line x1=\"2\" y1=\"21\" x2=\"2\" y2=\"12\" stroke=\"#222\" stroke-width=\"0.5\" fill=\"none\" stroke=\"#138078\"/><text x=\"0.9\" y=\"17.5\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" font-size=\"3\">h<\/text><text x=\"2.5\" y=\"24.5\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" >A<\/text><text x=\"37.5\" y=\"24.5\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" >B<\/text><text x=\"5.77\" y=\"10.8\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" >C<\/text><text x=\"34.43\" y=\"10.8\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.4\" fill=\"#222\" stroke=\"none\" >C'<\/text><\/svg>"}, {"d": "thales", "id": "tp15", "f": "<b>T 15<\/b> · Warum darf h beim Thaleskreis höchstens AB : 2 sein?", "b": "<p>Der höchste Punkt des Halbkreises liegt genau einen <b>Radius<\/b> über AB, also AB : 2.<\/p><p>h grösser als AB : 2 → die Parallele trifft den Kreis nicht → <b>keine Lösung<\/b>.<\/p>"}, {"d": "thales", "id": "tp16", "f": "<b>T 16<\/b> · AB = 10 cm ist Durchmesser, C liegt auf dem Halbkreis, AC = 6 cm:<br>Wie lang ist BC?", "b": "<p>Thales: Winkel bei C = 90°, AB ist die Hypotenuse.<\/p><p>BC² = 10² − 6² = 100 − 36 = 64<br>BC = √64 = <b>8 cm<\/b><\/p>"}, {"d": "thales", "id": "tp17", "f": "<b>A 17<\/b> · Diagonale im Quadrat mit Seite a?", "b": "<p>d² = a² + a² → <b>d = a · √2<\/b> ≈ a · 1.41<\/p><p>a = 5 cm: d² = 25 + 25 = 50<br>d = √50 ≈ <b>7.07 cm<\/b><\/p>"}, {"d": "thales", "id": "tp18", "f": "<b>A 18<\/b> · Höhe im gleichseitigen Dreieck mit Seite s?", "b": "<p>Die Höhe halbiert die Grundseite: Hypotenuse s, Katheten h und s : 2.<\/p><p>h² = s² − (s : 2)²<br>s = 30 cm: h² = 900 − 225 = 675<br>h = √675 ≈ <b>25.98 cm<\/b><\/p><p class='merke'>Fläche A = s · h : 2 ≈ 389.7 cm²<\/p>"}, {"d": "thales", "id": "tp19", "f": "<b>A 19<\/b> · Rechteck: Länge l und Diagonale f gegeben.<br>Wie findest du die Fläche?", "b": "<p>Die Diagonale ist die Hypotenuse: b² = f² − l²<\/p><p>l = 36 cm, f = 40.8 cm:<br>b² = 1'664.64 − 1'296 = 368.64<br>b = √368.64 = 19.2 cm<br>A = 36 · 19.2 = <b>691.2 cm²<\/b><\/p>"}, {"d": "thales", "id": "tp20", "f": "<b>A 20<\/b> · Abstand zweier Punkte im Koordinatennetz?", "b": "<p>Katheten = Differenz der <b>x-Werte<\/b> und der <b>y-Werte<\/b>.<\/p><p>A(0.5/5.5), C(8.5/0.5):<br>8.5 − 0.5 = 8, 5.5 − 0.5 = 5<br>AC² = 64 + 25 = 89<br>AC = √89 ≈ <b>9.43<\/b><\/p>"}, {"d": "thales", "id": "tp21", "f": "<b>A 21<\/b> · Massstab 1:50'000:<br>Wie viel ist 1 cm auf der Karte?", "b": "<p>1 cm auf der Karte = 50'000 cm = <b>500 m<\/b> in Wirklichkeit.<\/p><p>2 cm = 1 km<br>20 mm = 2 cm = <b>1'000 m<\/b><\/p><p class='merke'>Zuerst alles in die gleiche Einheit umrechnen.<\/p>"}, {"d": "thales", "id": "tp22", "f": "<b>A 22<\/b> · Seilbahn: 1'000 m horizontal, 307 m Höhenunterschied.<br>Seillänge auf Zehner?", "b": "<p>Horizontal und Höhe sind die Katheten, das Seil ist die Hypotenuse.<\/p><p>s² = 1'000² + 307² = 1'000'000 + 94'249 = 1'094'249<br>s = √1'094'249 ≈ 1'046.06<br>auf Zehner: <b>1'050 m<\/b><\/p>"}, {"d": "thales", "id": "tp23", "f": "<b>L 23<\/b> · Lösungsweg bei Pythagoras:<br>Welche 6 Schritte?", "b": "<ol><li>Skizze machen.<\/li><li>Rechten Winkel markieren.<\/li><li>Hypotenuse bestimmen (gegenüber dem rechten Winkel).<\/li><li>Formel: Hypotenuse gesucht plus, Kathete gesucht minus.<\/li><li>Einsetzen, rechnen, Wurzel ziehen.<\/li><li>Einheit und Probe: Ist die Hypotenuse die längste?<\/li><\/ol>"}, {"d": "thales", "id": "tp24", "f": "<b>L 24<\/b> · Typische Fehler bei Pythagoras und Thales?", "b": "<ul><li>Kathete gesucht, aber <b>plus<\/b> gerechnet.<\/li><li><b>Wurzel<\/b> am Schluss vergessen.<\/li><li>Zu früh gerundet: erst am Schluss runden.<\/li><li>Einheiten gemischt (mm und cm).<\/li><li>Hypotenuse falsch erkannt.<\/li><li>Bei der Konstruktion die <b>zweite Lösung<\/b> C' vergessen.<\/li><\/ul>"}], DECKS=[["1x1", "1x1 Reihen", "#2e8540"], ["einmaleins", "1x1 Tricks", "#1f5f99"], ["begriffe", "Begriffe", "#6b4fa0"], ["stellenwert", "Stellenwert & Komma", "#138078"], ["reihenfolge", "Punkt vor Strich", "#c8651b"], ["teilbarkeit", "Teilbarkeit", "#a0522d"], ["brueche", "Brüche", "#c0392b"], ["terme", "Terme & Potenzen", "#34495e"], ["pythagoras", "Pythagoras rechnen", "#1f6fd1"], ["thales", "Thales & Pythagoras", "#7b3fa0"]], TITEL="Mathe-Training";
const LS="lernapp-mathe-v1"; let st=JSON.parse(localStorage.getItem(LS)||"{}");
const save=()=>localStorage.setItem(LS,JSON.stringify(st));
const app=document.getElementById("app"), titel=document.getElementById("titel"), back=document.getElementById("zurueck"),
 home=document.getElementById("home");
const sicher=c=>(st[c.id]||{}).ok>=2&&!(st[c.id]||{}).last0, schwer=c=>(st[c.id]||{}).last0;
const farbe=d=>(DECKS.find(x=>x[0]===d)||[0,0,"#6b4fa0"])[2];
function deckKarten(d){return d==="alle"?K:d==="schwer"?K.filter(schwer):K.filter(c=>c.d===d)}
function zeile(d,n,c){const ks=deckKarten(d),s=ks.filter(sicher).length;
 return `<button class="deck" style="--c:${c}" onclick="start('${d}')"><b>${n}</b><small>${s} / ${ks.length} sicher</small></button>
 <div class="bar" style="--c:${c}"><i style="width:${ks.length?s/ks.length*100:0}%"></i></div>`}
function menu(){titel.textContent=TITEL;back.hidden=true;home.hidden=false;
 app.innerHTML=zeile("alle","Alles gemischt","#6b4fa0")+DECKS.map(([d,n,c])=>zeile(d,n,c)).join("")
 +(K.some(schwer)?zeile("schwer","Schwierige Kärtchen","#b8860b"):"")
 +`<p class="info">Antippen zeigt die Antwort. Sicher = zweimal hintereinander gewusst.</p>
 <button class="deck neutral" onclick="if(confirm('Lernstand löschen?')){st={};save();menu()}"><b>Lernstand zurücksetzen</b></button>`}
let stapel=[],idx=0,erst={};
function mischen(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(d,liste){back.hidden=false;home.hidden=true;
 titel.textContent=d==="alle"?"Alles gemischt":d==="schwer"?"Schwierige Kärtchen":(DECKS.find(x=>x[0]===d)||[0,"Fehler üben"])[1];
 let ks=mischen([...(liste||deckKarten(d))]);ks.sort((a,b)=>sicher(a)-sicher(b));
 stapel=ks;idx=0;erst={};zeige(false)}
function zeige(offen){if(idx>=stapel.length)return ende();
 const c=stapel[idx];
 let h=`<p class="info">noch ${stapel.length-idx} Kärtchen</p><div class="card" style="--c:${farbe(c.d)}" onclick="zeige(true)">
 <span class="tag">${(DECKS.find(x=>x[0]===c.d)||[0,""])[1]}</span><div class="vorne">${c.f}</div>`;
 h+=offen?`<div class="trenn"></div><div class="hinten">${c.b}</div>`:`<div class="hint">tippen zum Umdrehen</div>`;
 h+="</div>";
 if(offen)h+=`<div class="btns"><button class="nein" onclick="antwort(false)">Nochmals</button><button class="ja" onclick="antwort(true)">Gewusst</button></div>`;
 app.innerHTML=h;window.scrollTo(0,0)}
function antwort(ok){const c=stapel[idx],s=st[c.id]||(st[c.id]={ok:0,nok:0});
 if(!(c.id in erst))erst[c.id]=ok;
 if(ok){s.ok++;s.last0=false}else{s.nok++;s.last0=true;s.ok=0;stapel.splice(Math.min(idx+4,stapel.length),0,c)}
 save();idx++;zeige(false)}
function ende(){const ids=Object.keys(erst),gut=ids.filter(i=>erst[i]).length,falsch=K.filter(c=>erst[c.id]===false);
 app.innerHTML=`<div class="card end"><div>Beim ersten Versuch gewusst</div><div class="gross">${gut} / ${ids.length}</div>
 <div>${falsch.length?falsch.length+" Kärtchen waren schwierig":"Alles auf Anhieb!"}</div></div>
 <div class="btns">${falsch.length?`<button class="nein" onclick="start('fehler',K.filter(c=>erst[c.id]===false))">Fehler üben</button>`:""}
 <button class="grau" onclick="menu()">Menü</button></div>`}
back.onclick=menu;menu();
</script></body></html>
