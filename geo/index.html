const DECKS=[["alle","Alles gemischt"],["wappen","Wappen"],["hauptort","Hauptorte"],["fluss","Flüsse"],["see","Seen"],
 ["schwer","Schwierige Kärtchen"]];
const LS="chgeo-v1"; let st=JSON.parse(localStorage.getItem(LS)||"{}"); // id -> {ok, nok}
const save=()=>localStorage.setItem(LS,JSON.stringify(st));
const app=document.getElementById("app"), titel=document.getElementById("titel"), back=document.getElementById("zurueck");
const sicher=c=>(st[c.id]||{}).ok>=2 && !(st[c.id]||{}).last0; // zweimal gewusst, zuletzt richtig
const schwer=c=>(st[c.id]||{}).last0;
function deckKarten(d){return d==="alle"?K:d==="schwer"?K.filter(schwer):K.filter(c=>c.d===d)}
function menu(){
 titel.textContent="Schweiz Lernkärtchen"; back.hidden=true; document.getElementById("home").hidden=false;
 app.innerHTML=DECKS.map(([d,n])=>{const ks=deckKarten(d), s=ks.filter(sicher).length;
  if(d==="schwer"&&!ks.length) return "";
  return `<button class="deck ${d}" onclick="start('${d}')"><b>${n}</b><small>${s} / ${ks.length} sicher</small></button>
  <div class="bar ${d}"><i style="width:${ks.length?s/ks.length*100:0}%"></i></div>`}).join("")
  +`<p class="info">Tippe auf die Karte, um die Antwort zu sehen. Sicher = zweimal gewusst.</p>
  <button class="deck neutral" style="--c:#9aa5b1" onclick="if(confirm('Lernstand löschen?')){st={};save();menu()}"><b>Lernstand zurücksetzen</b></button>`;
}
let stapel=[], idx=0, erst={}, deckName="";
function mischen(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(d,liste){
 deckName=d; back.hidden=false; document.getElementById("home").hidden=true; titel.textContent=(DECKS.find(x=>x[0]===d)||[0,"Fehler üben"])[1];
 // unsichere zuerst, dann sichere
 let ks=liste||deckKarten(d); ks=mischen([...ks]); ks.sort((a,b)=>sicher(a)-sicher(b));
 stapel=ks.map(c=>c); idx=0; erst={}; zeige(false);
}
function vorne(c){
 let h=`<span class="tag">${c.d}</span>`;
 if(c.img) h+=`<img class="w" src="${W[c.img]}">`;
 if(c.map) h+=`<div class="map"><img src="${MAP[c.map]}"><span class="ring" style="left:${c.x}%;top:${c.y}%"></span></div>`;
 if(c.text) h+=`<div class="q">${c.text}</div>`; if(c.sub) h+=`<div class="sub">${c.sub}</div>`;
 if(c.lang) h+=`<div class="lang">${c.lang}</div>`; if(c.frage) h+=`<div class="frage">${c.frage}</div>`;
 return h;
}
function zeige(offen){
 if(idx>=stapel.length) return ende();
 const c=stapel[idx], rest=stapel.length-idx;
 let h=`<p class="info">noch ${rest} Kärtchen</p><div class="card ${c.d}" onclick="zeige(true)">${vorne(c)}`;
 if(offen){h+=`<div class="antwort">${c.a}</div>${c.a2?`<div class="sub">${c.a2}</div>`:""}${c.aimg?`<img class="wm" src="${W[c.aimg]}">`:""}`}
 else h+=`<div class="hint">tippen zum Umdrehen</div>`;
 h+="</div>";
 if(offen) h+=`<div class="btns"><button class="nein" onclick="antwort(false)">Nochmals</button><button class="ja" onclick="antwort(true)">Gewusst</button></div>`;
 app.innerHTML=h; window.scrollTo(0,0);
}
function antwort(ok){
 const c=stapel[idx], s=st[c.id]||(st[c.id]={ok:0,nok:0});
 if(!(c.id in erst)) erst[c.id]=ok;
 if(ok){s.ok++; s.last0=false} else {s.nok++; s.last0=true; s.ok=0;
  stapel.splice(Math.min(idx+4,stapel.length),0,c)} // kommt bald wieder
 save(); idx++; zeige(false);
}
function ende(){
 const ids=Object.keys(erst), gut=ids.filter(i=>erst[i]).length, falsch=K.filter(c=>erst[c.id]===false);
 app.innerHTML=`<div class="card alle end"><div>Beim ersten Versuch gewusst</div><div class="gross">${gut} / ${ids.length}</div>
 ${falsch.length?`<div>${falsch.length} Kärtchen waren schwierig</div>`:"<div>Alles auf Anhieb!</div>"}</div>
 <div class="btns">${falsch.length?`<button class="nein" onclick="start('fehler',K.filter(c=>erst[c.id]===false))">Fehler üben</button>`:""}
 <button class="neutral" onclick="menu()">Menü</button></div>`;
}
back.onclick=menu; menu();
</script></body></html>
