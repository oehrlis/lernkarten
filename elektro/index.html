.merke{color:#555;font-style:italic;font-size:.9em;border-left:3px solid #ccc;padding-left:8px}.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 2px}.fr span:first-child{border-bottom:2px solid currentColor;padding:0 3px}.lf{display:inline-block;width:34px;height:12px;border-radius:5px;vertical-align:middle}.skizze{display:block;margin:8px auto 0;width:auto;max-width:100%;height:auto;min-height:90px}.hinten p{margin:0 0 8px}.hinten ol,.hinten ul{margin:0;padding-left:22px;text-align:left}

<script>
const K=[{"d": "t0", "id": "e1", "f": "Wie lerne ich mit diesen Karten?", "b": "<ol><li>Frage lesen, Antwort <b>laut<\/b> sagen oder aufschreiben.<\/li><li>Umdrehen und vergleichen.<\/li><li>Gewusst: Stapel <b>Kann ich<\/b>. Nicht gewusst: Stapel <b>Nochmals<\/b>.<\/li><li>Jeden Tag 10 Minuten: zuerst den Stapel <b>Nochmals<\/b>.<\/li><li>Rechenkarten auf Papier lösen, <b>ohne Taschenrechner<\/b>.<\/li><\/ol>"}, {"d": "t0", "id": "e2", "f": "Tipps für den Eignungstest", "b": "<ul><li>Zuerst alles kurz anschauen, Leichtes zuerst.<\/li><li>Wenn du etwas nicht weisst: überspringen, später zurück.<\/li><li>Lösungsweg hinschreiben: gibt oft Teilpunkte.<\/li><li><b>Einheiten<\/b> immer mitschreiben (V, A, m², min).<\/li><li>Resultat prüfen: Ist das realistisch?<\/li><\/ul>"}, {"d": "t1", "id": "e3", "f": "Spannung, Strom, Widerstand, Leistung:<br>Formelzeichen und Einheit?", "b": "<table><tr><td>Spannung<\/td><td><b>U<\/b><\/td><td>Volt (V)<\/td><\/tr><tr><td>Strom<\/td><td><b>I<\/b><\/td><td>Ampere (A)<\/td><\/tr><tr><td>Widerstand<\/td><td><b>R<\/b><\/td><td>Ohm (Ω)<\/td><\/tr><tr><td>Leistung<\/td><td><b>P<\/b><\/td><td>Watt (W)<\/td><\/tr><\/table><p class='merke'>Bild Wasser: Spannung = Druck, Strom = Menge, die fliesst, Widerstand = Engstelle im Rohr.<\/p>"}, {"d": "t1", "id": "e4", "f": "Ohmsches Gesetz:<br>Formel und die zwei Umstellungen?", "b": "<p><b>U = R · I<\/b> &nbsp; <b>I = U : R<\/b> &nbsp; <b>R = U : I<\/b><\/p><svg class=\"skizze\" viewBox=\"0 0 30 22\" width=\"30mm\" height=\"22mm\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"15,1 29,21 1,21\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"8\" y1=\"11.5\" x2=\"22\" y2=\"11.5\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"15\" y1=\"11.5\" x2=\"15\" y2=\"21\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><text x=\"15\" y=\"10\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\" font-size=\"5\" font-weight=\"bold\">U<\/text><text x=\"10\" y=\"18.5\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\" font-size=\"5\" font-weight=\"bold\">R<\/text><text x=\"20\" y=\"18.5\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\" font-size=\"5\" font-weight=\"bold\">I<\/text><\/svg><p class='merke'>Im Dreieck das Gesuchte abdecken: Was übrig bleibt, ist die Formel.<\/p>"}, {"d": "t1", "id": "e5", "f": "Ein Bügeleisen hat 115 Ω und hängt an 230 V.<br>Wie gross ist der Strom?", "b": "<p>I = U : R<br>I = 230 V : 115 Ω = <b>2 A<\/b><\/p>"}, {"d": "t1", "id": "e6", "f": "Eine Kochplatte nimmt an 400 V einen Strom von 5 A auf.<br>Wie gross ist ihr Widerstand?", "b": "<p>R = U : I<br>R = 400 V : 5 A = <b>80 Ω<\/b><\/p>"}, {"d": "t1", "id": "e7", "f": "Leistung: Formel?<br>Eine Lampe an 230 V nimmt 0.5 A auf. Wie viele Watt?", "b": "<p><b>P = U · I<\/b><br>P = 230 V · 0.5 A = <b>115 W<\/b><\/p><p class='merke'>Umgestellt: I = P : U und U = P : I<\/p>"}, {"d": "t1", "id": "e8", "f": "Ein Stadion hat 30 Lampen mit je 1'000 W an 230 V.<br>Wie gross ist der Strom?", "b": "<p>P = 30 · 1'000 W = 30'000 W<br>I = P : U = 30'000 W : 230 V ≈ <b>130 A<\/b><\/p><p class='merke'>Ein Einfamilienhaus hat oft nur 25 bis 40 A Hauptsicherung.<\/p>"}, {"d": "t1", "id": "e9", "f": "Energie: Formel und Einheit?<br>Ein Föhn mit 2'000 W läuft 30 Minuten.", "b": "<p><b>E = P · t<\/b>, Einheit kWh (Kilowattstunde)<br>E = 2 kW · 0.5 h = <b>1 kWh<\/b><\/p><p class='merke'>Bei 30 Rappen pro kWh kostet das 30 Rappen.<\/p>"}, {"d": "t1", "id": "e10", "f": "Gleichstrom und Wechselstrom:<br>Was ist der Unterschied, woher kommt er?", "b": "<p><b>Gleichstrom<\/b> (DC, =): fliesst immer in die gleiche Richtung. Batterie, Akku, Solarzelle.<\/p><p><b>Wechselstrom<\/b> (AC, ~): wechselt dauernd die Richtung, in der Schweiz 50-mal pro Sekunde (<b>50 Hz<\/b>). Steckdose.<\/p>"}, {"d": "t1", "id": "e11", "f": "Welche Spannungen gibt es in der Hausinstallation in der Schweiz?", "b": "<p><b>230 V<\/b> zwischen Aussenleiter und Neutralleiter: Steckdosen, Licht.<\/p><p><b>400 V<\/b> zwischen zwei Aussenleitern (Drehstrom): Kochherd, Boiler, Wärmepumpe, Ladestation.<\/p><p>Frequenz: 50 Hz<\/p>"}, {"d": "t1", "id": "e12", "f": "Leiterfarben in der Hausinstallation?", "b": "<table><tr><td><span class='lf' style='background:linear-gradient(90deg,#2a2 50%,#ee2 50%)'><\/span><\/td><td><b>PE<\/b> Schutzleiter<\/td><td>grün-gelb<\/td><\/tr><tr><td><span class='lf' style='background:#2a6fdb'><\/span><\/td><td><b>N<\/b> Neutralleiter<\/td><td>blau<\/td><\/tr><tr><td><span class='lf' style='background:#8b4513'><\/span><\/td><td><b>L1, L2, L3<\/b> Aussenleiter<\/td><td>braun, schwarz, grau<\/td><\/tr><\/table><p class='merke'>Grün-gelb ist nur für den Schutzleiter, nie für etwas anderes.<\/p>"}, {"d": "t1", "id": "e13", "f": "Ausschaltung, Wechselschaltung, Kreuzschaltung:<br>Wann braucht man welche?", "b": "<p><b>Ausschaltung<\/b>: Licht von <b>1<\/b> Ort schalten.<\/p><p><b>Wechselschaltung<\/b>: von <b>2<\/b> Orten (2 Wechselschalter), z. B. Treppe, Gang.<\/p><p><b>Kreuzschaltung<\/b>: von <b>3 und mehr<\/b> Orten (Kreuzschalter zwischen 2 Wechselschaltern). Oft ersetzt durch Taster und Stromstossschalter.<\/p>"}, {"d": "t1", "id": "e14", "f": "Schaltung A und B:<br>Wie heissen sie, was ist der Unterschied?<svg class=\"skizze\" viewBox=\"0 0 80 30\" width=\"80mm\" height=\"30mm\" xmlns=\"http://www.w3.org/2000/svg\"><polyline points=\"2,11.5 2,4 11,4\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"17\" y1=\"4\" x2=\"22\" y2=\"4\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><polyline points=\"28,4 36,4 36,22 2,22 2,14\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><circle cx=\"14\" cy=\"4\" r=\"3\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"11.879\" y1=\"1.879\" x2=\"16.121\" y2=\"6.121\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"11.879\" y1=\"6.121\" x2=\"16.121\" y2=\"1.879\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><circle cx=\"25\" cy=\"4\" r=\"3\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"22.879\" y1=\"1.879\" x2=\"27.121\" y2=\"6.121\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"22.879\" y1=\"6.121\" x2=\"27.121\" y2=\"1.879\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"0\" y1=\"11.5\" x2=\"4\" y2=\"11.5\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"0.8\" y1=\"14\" x2=\"3.2\" y2=\"14\" stroke=\"#222\" stroke-width=\"1.2\"/><text x=\"19\" y=\"28\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">A<\/text><g transform=\"translate(44,0)\"><line x1=\"2\" y1=\"4\" x2=\"34\" y2=\"4\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"2\" y1=\"22\" x2=\"34\" y2=\"22\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"2\" y1=\"4\" x2=\"2\" y2=\"11.5\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"2\" y1=\"14\" x2=\"2\" y2=\"22\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"0\" y1=\"11.5\" x2=\"4\" y2=\"11.5\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"0.8\" y1=\"14\" x2=\"3.2\" y2=\"14\" stroke=\"#222\" stroke-width=\"1.2\"/><line x1=\"18\" y1=\"4\" x2=\"18\" y2=\"10\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"18\" y1=\"16\" x2=\"18\" y2=\"22\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><circle cx=\"18\" cy=\"13\" r=\"3\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"15.879\" y1=\"10.879\" x2=\"20.121\" y2=\"15.121\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"15.879\" y1=\"15.121\" x2=\"20.121\" y2=\"10.879\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"32\" y1=\"4\" x2=\"32\" y2=\"10\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"32\" y1=\"16\" x2=\"32\" y2=\"22\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><circle cx=\"32\" cy=\"13\" r=\"3\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"29.879\" y1=\"10.879\" x2=\"34.121\" y2=\"15.121\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"29.879\" y1=\"15.121\" x2=\"34.121\" y2=\"10.879\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><text x=\"18\" y=\"28\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">B<\/text><\/g><\/svg>", "b": "<p><b>A Serieschaltung<\/b>: ein Weg für den Strom. Gleicher Strom überall, die Spannung teilt sich auf. Fällt eine Lampe aus, sind alle dunkel.<\/p><p><b>B Parallelschaltung<\/b>: jede Lampe hat die volle Spannung, die Ströme zählen zusammen. So ist die Hausinstallation gebaut.<\/p>"}, {"d": "t1", "id": "e15", "f": "Widerstände 20 Ω und 30 Ω:<br>Gesamtwiderstand in Serie? Parallel?", "b": "<p>Serie: R = 20 Ω + 30 Ω = <b>50 Ω<\/b><\/p><p>Parallel: R = (20 · 30) : (20 + 30) = 600 : 50 = <b>12 Ω<\/b><\/p><p class='merke'>Parallel ist der Gesamtwiderstand immer kleiner als der kleinste.<\/p>"}, {"d": "t1", "id": "e16", "f": "Was bedeuten diese Schaltzeichen?<svg class=\"skizze\" viewBox=\"0 0 90 22\" width=\"90mm\" height=\"22mm\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"7\" cy=\"9\" r=\"3\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"4.879\" y1=\"6.879\" x2=\"9.121\" y2=\"11.121\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"4.879\" y1=\"11.121\" x2=\"9.121\" y2=\"6.879\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"17\" y1=\"9\" x2=\"21\" y2=\"9\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"21\" y1=\"9\" x2=\"28\" y2=\"5\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"28\" y1=\"9\" x2=\"31\" y2=\"9\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"38\" y1=\"9\" x2=\"42\" y2=\"9\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"42\" y1=\"5\" x2=\"42\" y2=\"13\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"44\" y1=\"7\" x2=\"44\" y2=\"11\" stroke=\"#222\" stroke-width=\"1.4\"/><line x1=\"44\" y1=\"9\" x2=\"48\" y2=\"9\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"53\" y1=\"9\" x2=\"56\" y2=\"9\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><rect x=\"56\" y=\"7\" width=\"9\" height=\"4\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"65\" y1=\"9\" x2=\"68\" y2=\"9\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"73\" y1=\"9\" x2=\"88\" y2=\"9\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><rect x=\"76\" y=\"7\" width=\"9\" height=\"4\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><text x=\"7\" y=\"20\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">1<\/text><text x=\"24\" y=\"20\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">2<\/text><text x=\"43\" y=\"20\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">3<\/text><text x=\"60.5\" y=\"20\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">4<\/text><text x=\"80.5\" y=\"20\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">5<\/text><\/svg>", "b": "<p>1 Lampe<br>2 Schalter (offen)<br>3 Batterie (langer Strich = Plus)<br>4 Widerstand<br>5 Sicherung<\/p>"}, {"d": "t1", "id": "e17", "f": "Wozu dienen Sicherung und FI-Schutzschalter?", "b": "<p><b>Sicherung<\/b> (Leitungsschutzschalter): schützt die <b>Leitung<\/b> vor zu viel Strom (Überlast, Kurzschluss). Sonst wird sie heiss: Brandgefahr.<\/p><p><b>FI-Schutzschalter<\/b> (RCD): schützt den <b>Menschen<\/b>. Schaltet ab, wenn Strom falsch abfliesst, z. B. durch den Körper, schon ab 30 mA.<\/p>"}, {"d": "t1", "id": "e18", "f": "Was ist ein Kurzschluss?", "b": "<p>Aussenleiter und Neutralleiter (oder Schutzleiter) berühren sich direkt, ohne Verbraucher dazwischen.<\/p><p>Widerstand fast 0 Ω, der Strom wird riesig, die <b>Sicherung<\/b> löst aus.<\/p>"}, {"d": "t1", "id": "e19", "f": "Wozu braucht es den Schutzleiter (PE)?", "b": "<p>Er verbindet Metallgehäuse (Waschmaschine, Herd) mit der Erde.<\/p><p>Ist ein Gerät defekt, fliesst der Strom über den Schutzleiter ab und nicht durch den Menschen. Sicherung oder FI schalten ab.<\/p>"}, {"d": "t1", "id": "e20", "f": "Die 5 Sicherheitsregeln vor dem Arbeiten an elektrischen Anlagen?", "b": "<ol><li>Freischalten und allseitig trennen<\/li><li>Gegen Wiedereinschalten sichern<\/li><li>Auf Spannungslosigkeit prüfen<\/li><li>Erden und kurzschliessen<\/li><li>Gegen benachbarte, unter Spannung stehende Teile schützen<\/li><\/ol><p class='merke'>Quelle: Suva, lebenswichtige Regeln Elektro.<\/p>"}, {"d": "t1", "id": "e21", "f": "Ab wann ist Strom durch den Körper gefährlich?", "b": "<p>Schon ab etwa <b>30 mA<\/b> (0.03 A) kann das Herz aus dem Takt kommen (Herzkammerflimmern). Darum löst der FI bei 30 mA aus.<\/p><p>Wechselspannung über <b>50 V<\/b> gilt als gefährlich. 230 V aus der Steckdose ist lebensgefährlich.<\/p>"}, {"d": "t1", "id": "e22", "f": "Leiter und Isolatoren:<br>Je drei Beispiele?", "b": "<p><b>Leiter<\/b>: Kupfer, Aluminium, Silber, Gold, Eisen, Salzwasser, der Mensch.<\/p><p><b>Isolatoren<\/b>: Kunststoff (PVC), Gummi, Glas, Keramik, trockenes Holz, Luft.<\/p><p class='merke'>Kabel: Kupferader innen, Kunststoffisolation aussen.<\/p>"}, {"d": "t1", "id": "e23", "f": "Wie misst man Spannung, wie misst man Strom?", "b": "<p><b>Spannung<\/b>: Messgerät <b>parallel<\/b> zum Verbraucher (an beide Anschlüsse).<\/p><p><b>Strom<\/b>: Messgerät <b>in Serie<\/b>, der Stromkreis wird dafür aufgetrennt. Oder mit der Stromzange um einen Leiter.<\/p>"}, {"d": "t1", "id": "e24", "f": "Steckdosen in der Schweiz:<br>Welche Typen, welche Leiter?", "b": "<p><b>Typ 13<\/b>: 230 V, 10 A, 3 Pole: L, N, PE (Schutzleiter).<\/p><p><b>Typ 23<\/b>: 230 V, 16 A (eckige Stifte).<\/p><p><b>Typ 15<\/b>: 400 V Drehstrom, 5 Pole (L1, L2, L3, N, PE).<\/p>"}, {"d": "t1", "id": "e25", "f": "Generator, Motor, Transformator:<br>Was machen sie?", "b": "<p><b>Generator<\/b>: Bewegung wird zu Strom (Kraftwerk, Velo-Dynamo).<\/p><p><b>Elektromotor<\/b>: Strom wird zu Bewegung.<\/p><p><b>Transformator<\/b> (Trafo): ändert die Spannung, z. B. 230 V auf 12 V für Leuchten.<\/p>"}, {"d": "t1", "id": "e26", "f": "Glühlampe oder LED:<br>Was ist der Unterschied?", "b": "<p><b>Glühlampe<\/b>: macht vor allem Wärme, nur etwa 5 % wird Licht.<\/p><p><b>LED<\/b>: braucht rund 85 % weniger Strom für gleich viel Licht und hält viel länger. Eine LED mit 8 W ersetzt etwa eine Glühlampe mit 60 W.<\/p>"}, {"d": "t1", "id": "e27", "f": "Woher kommt der Strom?<br>Erneuerbar oder nicht erneuerbar?", "b": "<p><b>Erneuerbar<\/b>: Wasserkraft (in der Schweiz rund 60 %), Sonne (Solarzellen), Wind, Biomasse, Erdwärme.<\/p><p><b>Nicht erneuerbar<\/b>: Kernkraft (Atomstrom, in der Schweiz rund ein Drittel), Kohle, Gas, Öl.<\/p>"}, {"d": "t1", "id": "e28", "f": "Energiespeicher:<br>Nenne mindestens vier.", "b": "<ul><li>Batterie, Akku (chemisch)<\/li><li>Stausee, Pumpspeicherwerk (Lageenergie)<\/li><li>Boiler, Wärmespeicher (Wärme)<\/li><li>Schwungrad (Bewegung)<\/li><li>Kondensator (elektrisch)<\/li><li>Wasserstoff, Benzin (chemisch)<\/li><\/ul>"}, {"d": "t2", "id": "e29", "f": "<span class=\"fr\"><span>1<\/span><span>4<\/span><\/span> + <span class=\"fr\"><span>1<\/span><span>6<\/span><\/span> = ?", "b": "<p>Gemeinsamer Nenner 12:<br><span class=\"fr\"><span>3<\/span><span>12<\/span><\/span> + <span class=\"fr\"><span>2<\/span><span>12<\/span><\/span> = <b><span class=\"fr\"><span>5<\/span><span>12<\/span><\/span><\/b><\/p><p class='merke'>Erst gleichnamig machen (gleicher Nenner), dann nur die Zähler addieren. Nenner nie addieren!<\/p>"}, {"d": "t2", "id": "e30", "f": "<span class=\"fr\"><span>3<\/span><span>4<\/span><\/span> − <span class=\"fr\"><span>1<\/span><span>32<\/span><\/span> = ?", "b": "<p>Gemeinsamer Nenner 32:<br><span class=\"fr\"><span>24<\/span><span>32<\/span><\/span> − <span class=\"fr\"><span>1<\/span><span>32<\/span><\/span> = <b><span class=\"fr\"><span>23<\/span><span>32<\/span><\/span><\/b><\/p><p class='merke'>3 · 8 = 24: Zähler und Nenner mit der gleichen Zahl erweitern.<\/p>"}, {"d": "t2", "id": "e31", "f": "<span class=\"fr\"><span>14<\/span><span>4<\/span><\/span> · <span class=\"fr\"><span>8<\/span><span>16<\/span><\/span> = ?", "b": "<p>Zuerst kürzen: <span class=\"fr\"><span>7<\/span><span>2<\/span><\/span> · <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> = <b><span class=\"fr\"><span>7<\/span><span>4<\/span><\/span><\/b> = 1 <span class=\"fr\"><span>3<\/span><span>4<\/span><\/span><\/p><p class='merke'>Mal: Zähler mal Zähler, Nenner mal Nenner. Kein gemeinsamer Nenner nötig.<\/p>"}, {"d": "t2", "id": "e32", "f": "<span class=\"fr\"><span>4<\/span><span>9<\/span><\/span> : <span class=\"fr\"><span>1<\/span><span>4<\/span><\/span> = ?", "b": "<p>Mit dem Kehrwert malnehmen:<br><span class=\"fr\"><span>4<\/span><span>9<\/span><\/span> · <span class=\"fr\"><span>4<\/span><span>1<\/span><\/span> = <b><span class=\"fr\"><span>16<\/span><span>9<\/span><\/span><\/b> = 1 <span class=\"fr\"><span>7<\/span><span>9<\/span><\/span><\/p><p class='merke'>Teilen durch einen Bruch = mal den umgedrehten Bruch.<\/p>"}, {"d": "t2", "id": "e33", "f": "Als Dezimalzahl und in Prozent?<br><span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> &nbsp; <span class=\"fr\"><span>1<\/span><span>4<\/span><\/span> &nbsp; <span class=\"fr\"><span>3<\/span><span>4<\/span><\/span> &nbsp; <span class=\"fr\"><span>1<\/span><span>5<\/span><\/span> &nbsp; <span class=\"fr\"><span>1<\/span><span>8<\/span><\/span> &nbsp; <span class=\"fr\"><span>1<\/span><span>3<\/span><\/span>", "b": "<table><tr><td>1/2<\/td><td>0.5<\/td><td>50 %<\/td><td>1/5<\/td><td>0.2<\/td><td>20 %<\/td><\/tr><tr><td>1/4<\/td><td>0.25<\/td><td>25 %<\/td><td>1/8<\/td><td>0.125<\/td><td>12.5 %<\/td><\/tr><tr><td>3/4<\/td><td>0.75<\/td><td>75 %<\/td><td>1/3<\/td><td>0.333…<\/td><td>33.3 %<\/td><\/tr><\/table>"}, {"d": "t2", "id": "e34", "f": "Längen umrechnen:<br>0.7 m = ? cm = ? mm<br>2.5 km = ? m", "b": "<p>0.7 m = <b>70 cm<\/b> = <b>700 mm<\/b><br>2.5 km = <b>2'500 m<\/b><\/p><p class='merke'>km → m: mal 1'000. Dann m → dm → cm → mm: je mal 10.<\/p>"}, {"d": "t2", "id": "e35", "f": "Flächen umrechnen:<br>16 m² = ? dm² = ? mm²", "b": "<p>16 m² = <b>1'600 dm²<\/b> = 160'000 cm² = <b>16'000'000 mm²<\/b><\/p><p class='merke'>Bei Flächen ist jede Stufe <b>mal 100<\/b>, denn 1 m² = 10 dm · 10 dm = 100 dm².<\/p>"}, {"d": "t2", "id": "e36", "f": "Volumen umrechnen:<br>1 m³ = ? dm³ = ? Liter<br>1 dm³ = ? cm³", "b": "<p>1 m³ = <b>1'000 dm³<\/b> = <b>1'000 l<\/b><br>1 dm³ = 1 l = <b>1'000 cm³<\/b><br>1 cm³ = 1 ml<\/p><p class='merke'>Bei Volumen ist jede Stufe <b>mal 1'000<\/b>.<\/p>"}, {"d": "t2", "id": "e37", "f": "Zeit umrechnen:<br>1.6 h = ? min<br>42 min = ? h<br>2 h 24 min = ? h", "b": "<p>1.6 · 60 = <b>96 min<\/b> = 1 h 36 min<br>42 : 60 = <b>0.7 h<\/b><br>24 : 60 = 0.4, also <b>2.4 h<\/b><\/p><p class='merke'>Eine Stunde hat 60 Minuten, nicht 100!<\/p>"}, {"d": "t2", "id": "e38", "f": "Vorsätze: Was bedeuten k, M, G, m,&nbsp;µ?<br>2.5 kW = ? W &nbsp; 300 mA = ? A", "b": "<table><tr><td>k kilo<\/td><td>1'000<\/td><td>10³<\/td><\/tr><tr><td>M Mega<\/td><td>1'000'000<\/td><td>10⁶<\/td><\/tr><tr><td>G Giga<\/td><td>1'000'000'000<\/td><td>10⁹<\/td><\/tr><tr><td>m milli<\/td><td>0.001<\/td><td>10⁻³<\/td><\/tr><tr><td>µ mikro<\/td><td>0.000001<\/td><td>10⁻⁶<\/td><\/tr><\/table><p>2.5 kW = <b>2'500 W<\/b> &nbsp; 300 mA = <b>0.3 A<\/b><\/p>"}, {"d": "t2", "id": "e39", "f": "Ein Lieferwagen braucht 8.4 l auf 100 km.<br>Wie weit kommt er mit 65 l?", "b": "<p>8.4 l → 100 km<br>1 l → 100 : 8.4 km<br>65 l → 65 · 100 : 8.4 ≈ <b>774 km<\/b><\/p><p class='merke'>Proportional: doppelt so viel Diesel, doppelt so weit.<\/p>"}, {"d": "t2", "id": "e40", "f": "4 Monteure brauchen 2 h 24 min.<br>Wie lange brauchen 3 Monteure?", "b": "<p>2 h 24 min = 144 min<br>1 Monteur: 4 · 144 = 576 min<br>3 Monteure: 576 : 3 = 192 min = <b>3 h 12 min<\/b><\/p><p class='merke'>Umgekehrt proportional: weniger Leute, mehr Zeit.<\/p>"}, {"d": "t2", "id": "e41", "f": "Eine Waschmaschine kostet 750 Franken.<br>Wie viel sind 15 % Rabatt?", "b": "<p>750 · 15 : 100 = <b>112.50 Franken<\/b><br>Neuer Preis: 750 − 112.50 = 637.50 Franken<\/p><p class='merke'>Prozentwert = Grundwert · Prozentsatz : 100<\/p>"}, {"d": "t2", "id": "e42", "f": "Ein Möbel kostet statt 1'280 nur noch 980 Franken.<br>Wie viel Prozent Rabatt?", "b": "<p>Rabatt: 1'280 − 980 = 300 Franken<br>300 : 1'280 · 100 ≈ <b>23.4 %<\/b><\/p><p class='merke'>Prozentsatz = Prozentwert : Grundwert · 100. Grundwert ist immer der alte Preis.<\/p>"}, {"d": "t2", "id": "e43", "f": "Auf 800 m Strecke sinkt eine Leitung um 5 m.<br>Wie gross ist das Gefälle in ‰?", "b": "<p>5 : 800 · 1'000 = <b>6.25 ‰<\/b><\/p><p class='merke'>Prozent % = von 100, Promille ‰ = von 1'000. 1 % = 10 ‰<\/p>"}, {"d": "t2", "id": "e44", "f": "Potenzen:<br>10³ · 10⁴ = ? &nbsp; 10⁵ : 10² = ?<br>10⁻³ = ? &nbsp; a² + a² = ?", "b": "<p>10³ · 10⁴ = <b>10⁷<\/b><br>10⁵ : 10² = <b>10³<\/b><br>10⁻³ = <b>0.001<\/b><br>a² + a² = <b>2a²<\/b><\/p><p class='merke'>Gleiche Basis: mal → Hochzahlen addieren, geteilt → subtrahieren. 10⁰ = 1<\/p>"}, {"d": "t2", "id": "e45", "f": "Vereinfache:<br>14b + 8b − 3c − 16b − 12c<br>12x + 4y − 3x − y", "b": "<p>14b + 8b − 16b = 6b, −3c − 12c = −15c<br>→ <b>6b − 15c<\/b><\/p><p>12x − 3x = 9x, 4y − y = 3y<br>→ <b>9x + 3y<\/b><\/p><p class='merke'>Nur gleiche Buchstaben zusammenzählen.<\/p>"}, {"d": "t2", "id": "e46", "f": "Klammern auflösen:<br>−5 · (3 + 6)<br>3a · (3a + 2 − 3b)<br>(a + b)²", "b": "<p>−5 · 9 = <b>−45<\/b><br><b>9a² + 6a − 9ab<\/b><br><b>a² + 2ab + b²<\/b><\/p><p class='merke'>Jedes Glied in der Klammer mit dem Faktor davor malnehmen.<\/p>"}, {"d": "t2", "id": "e47", "f": "Löse nach x auf: 3x + 7 = 25<br>Löse P = U · I nach I auf.", "b": "<p>3x + 7 = 25 &nbsp; | − 7<br>3x = 18 &nbsp; | : 3<br><b>x = 6<\/b><\/p><p>P = U · I &nbsp; | : U<br><b>I = P : U<\/b><\/p><p class='merke'>Auf beiden Seiten immer das Gleiche tun.<\/p>"}, {"d": "t2", "id": "e48", "f": "Rechne ohne Taschenrechner:<br>3 + 4 · 5 − 12 : 3<br>(3 + 4) · 5", "b": "<p>3 + 20 − 4 = <b>19<\/b><br>7 · 5 = <b>35<\/b><\/p><p class='merke'>Klammer vor Punkt (· :) vor Strich (+ −).<\/p>"}, {"d": "t2", "id": "e49", "f": "Negative Zahlen:<br>−15 − 12 + 32<br>15 + (−13)<br>(−2) · (−3) · (−1)", "b": "<p><b>5<\/b><br><b>2<\/b><br><b>−6<\/b><\/p><p class='merke'>Minus mal minus gibt plus. Eine ungerade Anzahl Minus gibt minus.<\/p>"}, {"d": "t2", "id": "e50", "f": "Runde auf 3 Stellen:<br>773.81 &nbsp; 0.023456 &nbsp; 12'749", "b": "<p><b>774<\/b><br><b>0.0235<\/b><br><b>12'700<\/b><\/p><p class='merke'>3 Stellen = die ersten 3 Ziffern, die nicht 0 sind. Ab 5 aufrunden.<\/p>"}, {"d": "t3", "id": "e51", "f": "Eine Leiter (2.5 m) steht 1.5 m von der Wand weg.<br>Wie hoch reicht sie?<svg class=\"skizze\" viewBox=\"0 0 46 30\" width=\"46mm\" height=\"30mm\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"6\" y1=\"1\" x2=\"6\" y2=\"26\" stroke=\"#888\" stroke-width=\"2\"/><line x1=\"2\" y1=\"26\" x2=\"44\" y2=\"26\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"7\" y1=\"5\" x2=\"30\" y2=\"26\" stroke=\"#a0522d\" stroke-width=\"1.2\"/><circle cx=\"7\" cy=\"5\" r=\"1.6\" fill=\"#f5c400\" stroke=\"#222\" stroke-width=\"0.4\"/><polyline points=\"7,22 10,22 10,26\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><text x=\"22\" y=\"13\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">2.5 m<\/text><text x=\"18.5\" y=\"29.8\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">1.5 m<\/text><text x=\"8.5\" y=\"16\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">h ?<\/text><\/svg>", "b": "<p><b>a² + b² = c²<\/b> (c = Leiter, längste Seite)<br>h² = 2.5² − 1.5² = 6.25 − 2.25 = 4<br>h = <b>2 m<\/b><\/p><p class='merke'>Pythagoras gilt nur im rechtwinkligen Dreieck.<\/p>"}, {"d": "t3", "id": "e52", "f": "Rechtwinkliges Dreieck mit den Katheten 3 cm und 4 cm:<br>Hypotenuse? Fläche?", "b": "<p>c² = 3² + 4² = 9 + 16 = 25<br>c = <b>5 cm<\/b><\/p><p>A = 3 · 4 : 2 = <b>6 cm²<\/b><\/p>"}, {"d": "t3", "id": "e53", "f": "Flächenformeln:<br>Rechteck, Quadrat, Dreieck, Kreis?", "b": "<p>Rechteck: A = a · b<br>Quadrat: A = a · a<br>Dreieck: A = g · h : 2<br>Kreis: A = r · r · π<\/p><p class='merke'>Umfang Rechteck: U = 2 · a + 2 · b<\/p>"}, {"d": "t3", "id": "e54", "f": "Kreis mit Durchmesser 30 cm:<br>Umfang? Fläche? (π ≈ 3.14)", "b": "<p>U = d · π = 30 · 3.14 ≈ <b>94.2 cm<\/b><\/p><p>A = r · r · π = 15 · 15 · 3.14 = <b>706.5 cm²<\/b><\/p><p class='merke'>Radius r = Durchmesser : 2<\/p>"}, {"d": "t3", "id": "e55", "f": "Eine Kabelrolle hat einen mittleren Durchmesser von 30 cm und 35 Windungen.<br>Wie viel Kabel ist darauf?", "b": "<p>1 Windung = d · π = 0.3 m · 3.14 ≈ 0.94 m<br>35 · 0.94 m ≈ <b>33 m<\/b><\/p>"}, {"d": "t3", "id": "e56", "f": "Wie gross ist diese Fläche? (Masse in m)<svg class=\"skizze\" viewBox=\"0 0 50 30\" width=\"50mm\" height=\"30mm\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"8.0,3.0 26.0,3.0 26.0,13.5 44.0,13.5 44.0,25.5 8.0,25.5\" fill=\"#e8f3e8\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><polygon points=\"26,3 44,3 44,13.5 26,13.5\" fill=\"none\" stroke=\"#999\" stroke-width=\"0.4\" stroke-dasharray=\"1,1\"/><text x=\"17\" y=\"2.6\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">12<\/text><text x=\"35\" y=\"2.6\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">12<\/text><text x=\"26\" y=\"29.5\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">24<\/text><text x=\"1.5\" y=\"21\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">15<\/text><text x=\"45\" y=\"9.5\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">7<\/text><\/svg>", "b": "<p>Ganzes Rechteck minus Ecke:<br>24 · 15 − 12 · 7 = 360 − 84 = <b>276 m²<\/b><\/p><p>Oder zerlegen: 12 · 15 + 12 · 8 = 180 + 96 = 276 m²<\/p><p class='merke'>Fehlende Masse zuerst ausrechnen: 15 − 7 = 8.<\/p>"}, {"d": "t3", "id": "e57", "f": "Volumenformeln:<br>Quader, Würfel, Zylinder?", "b": "<p>Quader: V = a · b · c<br>Würfel: V = a · a · a<br>Zylinder: V = r · r · π · h<\/p><p class='merke'>Allgemein: Grundfläche mal Höhe.<\/p>"}, {"d": "t3", "id": "e58", "f": "Ein rundes Becken (Durchmesser 1.2 m) ist 50 cm hoch mit Wasser gefüllt.<br>Wie viele Liter?", "b": "<p>r = 0.6 m = 6 dm, h = 5 dm<br>V = 6 · 6 · 3.14 · 5 ≈ <b>565 dm³ = 565 l<\/b><\/p><p class='merke'>In dm rechnen: dann sind dm³ gleich Liter. 1 l Wasser wiegt 1 kg.<\/p>"}, {"d": "t3", "id": "e59", "f": "Winkel:<br>Winkelsumme im Dreieck und im Viereck?<br>Ein Dreieck hat 52° und 24°. Dritter Winkel?", "b": "<p>Dreieck: <b>180°<\/b>, Viereck: <b>360°<\/b><br>180° − 52° − 24° = <b>104°<\/b><\/p><p class='merke'>Rechter Winkel 90°, gestreckter Winkel 180°, Vollwinkel 360°.<\/p>"}, {"d": "t3", "id": "e60", "f": "Dichte: Formel?<br>Kupferdraht: 100 m lang, 1.5 mm² Querschnitt, ρ = 8.9 kg/dm³. Masse?", "b": "<p><b>ρ = m : V<\/b>, also m = ρ · V<\/p><p>V = 1.5 mm² · 100'000 mm = 150'000 mm³ = 0.15 dm³<br>m = 8.9 · 0.15 = <b>1.335 kg<\/b><\/p>"}, {"d": "t3", "id": "e61", "f": "Würfel und Pyramide (quadratische Grundfläche):<br>Wie viele Flächen, Kanten, Ecken?", "b": "<p><b>Würfel<\/b>: 6 Flächen, 12 Kanten, 8 Ecken<\/p><p><b>Pyramide<\/b>: 5 Flächen, 8 Kanten, 5 Ecken<\/p><p class='merke'>Würfelnetz: Gegenüberliegende Seiten liegen im Netz nie nebeneinander.<\/p>"}, {"d": "t4", "id": "e62", "f": "Wie findest du die Regel einer Zahlenreihe?", "b": "<ol><li>Differenzen bilden (was kommt dazu?)<\/li><li>Differenzen der Differenzen anschauen<\/li><li>Auf mal und geteilt prüfen<\/li><li>Wechseln sich zwei Regeln ab?<\/li><li>Sind es zwei Reihen ineinander (jede zweite Zahl)?<\/li><\/ol>"}, {"d": "t4", "id": "e63", "f": "Setze fort:<br>8, 11, 14, 17, …<br>5678, 5701, 5724, …", "b": "<p>Immer + 3: <b>20, 23, 26<\/b><\/p><p>Immer + 23: <b>5747, 5770, 5793<\/b><\/p>"}, {"d": "t4", "id": "e64", "f": "Setze fort:<br>5, 0, −10, −30, …", "b": "<p>Differenzen: −5, −10, −20: verdoppeln sich<br>−30 − 40 = <b>−70<\/b>, −70 − 80 = <b>−150<\/b><\/p>"}, {"d": "t4", "id": "e65", "f": "Setze fort:<br>1, 2, 4, 7, 11, …<br>4, 6, 12, 14, 28, 30, …", "b": "<p>+1, +2, +3, +4, … → <b>16, 22<\/b><\/p><p>abwechselnd +2 und ·2 → <b>60, 62<\/b><\/p>"}, {"d": "t4", "id": "e66", "f": "Setze fort:<br>1, 7, 2, 6, 3, 5, 4, …<br>19, 16, 22, 19, 25, 22, 28, …", "b": "<p>Zwei Reihen ineinander: 1, 2, 3, 4 und 7, 6, 5 → <b>4, 5<\/b><\/p><p>abwechselnd −3 und +6 → <b>25, 31<\/b><\/p>"}, {"d": "t4", "id": "e67", "f": "Setze fort:<br>224, 112, 112, 56, 56, 28, 28, …", "b": "<p>abwechselnd : 2 und gleich bleiben → <b>14, 14<\/b><\/p>"}, {"d": "t4", "id": "e68", "f": "In einem Stall sind 35 Hühner und Hasen mit zusammen 94 Beinen.<br>Wie viele Hasen?", "b": "<p>Wären alle Hühner: 35 · 2 = 70 Beine<br>Es fehlen 94 − 70 = 24 Beine<br>Jeder Hase hat 2 Beine mehr: 24 : 2 = <b>12 Hasen<\/b>, 23 Hühner<\/p>"}, {"d": "t4", "id": "e69", "f": "Rad 1 dreht im Uhrzeigersinn.<br>Wie drehen 2, 3 und 4?<svg class=\"skizze\" viewBox=\"0 0 46 15\" width=\"46mm\" height=\"15mm\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"pf\" markerWidth=\"4\" markerHeight=\"4\" refX=\"2\" refY=\"2\" orient=\"auto\"><path d=\"M0,0 L4,2 L0,4 z\" fill=\"#222\"/><\/marker><\/defs><circle cx=\"6\" cy=\"8\" r=\"5\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><text x=\"6\" y=\"9.3\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">1<\/text><circle cx=\"17\" cy=\"8\" r=\"5\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><text x=\"17\" y=\"9.3\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">2<\/text><circle cx=\"28\" cy=\"8\" r=\"5\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><text x=\"28\" y=\"9.3\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">3<\/text><circle cx=\"39\" cy=\"8\" r=\"5\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><text x=\"39\" y=\"9.3\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">4<\/text><path d=\"M 2.5 3 A 5.5 5.5 0 0 1 9.5 3\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\" marker-end=\"url(#pf)\"/><\/svg>", "b": "<p>Zahnräder, die sich berühren, drehen <b>entgegengesetzt<\/b>.<br>1 und 3: Uhrzeigersinn, 2 und 4: Gegenuhrzeigersinn<\/p><p class='merke'>Ein geschlossener Kreis aus einer <b>ungeraden<\/b> Zahl von Zahnrädern blockiert: Nichts dreht sich.<\/p>"}, {"d": "t4", "id": "e70", "f": "Riemen A und B: Drehen beide Räder gleich oder entgegengesetzt?<svg class=\"skizze\" viewBox=\"0 0 84 23\" width=\"84mm\" height=\"23mm\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"8\" cy=\"9\" r=\"6\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><circle cx=\"30\" cy=\"9\" r=\"6\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"8\" y1=\"3\" x2=\"30\" y2=\"3\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"8\" y1=\"15\" x2=\"30\" y2=\"15\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><text x=\"19.0\" y=\"21\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">A<\/text><circle cx=\"52\" cy=\"9\" r=\"6\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><circle cx=\"74\" cy=\"9\" r=\"6\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"52\" y1=\"3\" x2=\"74\" y2=\"15\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"52\" y1=\"15\" x2=\"74\" y2=\"3\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><text x=\"63.0\" y=\"21\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">B<\/text><\/svg>", "b": "<p><b>A offener Riemen<\/b>: gleiche Richtung<\/p><p><b>B gekreuzter Riemen<\/b>: entgegengesetzt<\/p><p class='merke'>Das kleine Rad dreht schneller als das grosse.<\/p>"}, {"d": "t4", "id": "e71", "f": "Ein Zahnrad mit 40 Zähnen treibt eines mit 10 Zähnen.<br>Das grosse dreht 1-mal: Wie oft dreht das kleine?", "b": "<p>40 : 10 = <b>4-mal<\/b><\/p><p class='merke'>Velo bergauf: vorne kleines, hinten grosses Zahnrad. Langsamer, aber mit weniger Kraft.<\/p>"}, {"d": "t4", "id": "e72", "f": "Wo muss das Kind mit 3 kg sitzen, damit die Wippe im Gleichgewicht ist?<svg class=\"skizze\" viewBox=\"0 0 60 20\" width=\"60mm\" height=\"20mm\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"2\" y1=\"10\" x2=\"58\" y2=\"10\" stroke=\"#222\" stroke-width=\"1\"/><polygon points=\"26,10 23,16 29,16\" fill=\"#ccc\" stroke=\"#222\" stroke-width=\"0.4\"/><rect x=\"4\" y=\"4\" width=\"6\" height=\"6\" fill=\"#bcd\" stroke=\"#222\" stroke-width=\"0.4\"/><text x=\"7\" y=\"3\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">2 kg<\/text><text x=\"15\" y=\"14\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">3 m<\/text><text x=\"40\" y=\"7\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">3 kg: wo?<\/text><\/svg>", "b": "<p>Gewicht · Abstand links = Gewicht · Abstand rechts<br>2 · 3 = 3 · x<br>x = <b>2 m<\/b> rechts vom Drehpunkt<\/p>"}, {"d": "t4", "id": "e73", "f": "Gleiche Wasserhöhe in A, B und C:<br>Wo ist der Druck am Boden am grössten?<svg class=\"skizze\" viewBox=\"0 0 60 24\" width=\"60mm\" height=\"24mm\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"3\" y=\"6\" width=\"12\" height=\"15\" fill=\"#cfe6f7\" stroke=\"none\"/><rect x=\"3\" y=\"2\" width=\"12\" height=\"19\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><polygon points=\"22,6 38,6 34,21 26,21\" fill=\"#cfe6f7\" stroke=\"none\"/><polyline points=\"20,2 26,21 34,21 40,2\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><rect x=\"47\" y=\"6\" width=\"5\" height=\"15\" fill=\"#cfe6f7\" stroke=\"none\"/><rect x=\"47\" y=\"2\" width=\"5\" height=\"19\" stroke=\"#222\" stroke-width=\"0.6\" fill=\"none\"/><line x1=\"1\" y1=\"6\" x2=\"58\" y2=\"6\" stroke=\"#36c\" stroke-width=\"0.3\" stroke-dasharray=\"1,1\"/><text x=\"9\" y=\"24\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">A<\/text><text x=\"30\" y=\"24\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">B<\/text><text x=\"49.5\" y=\"24\" text-anchor=\"middle\" font-family=\"Helvetica, Arial\" font-size=\"3.6\" fill=\"#222\">C<\/text><\/svg>", "b": "<p><b>Überall gleich.<\/b> Der Druck hängt nur von der Höhe des Wassers ab, nicht von der Form oder der Menge.<\/p><p class='merke'>10 m Wassersäule ≈ 1 bar<\/p>"}, {"d": "t4", "id": "e74", "f": "Physik im Alltag: Was passiert?<br>a) Alkohol auf der Hand<br>b) Pendel: länger oder schwerer, was macht es langsamer?<br>c) Stein an einer Schnur: Schnur reisst", "b": "<p>a) Es wird <b>kalt<\/b>: Verdunsten braucht Wärme.<\/p><p>b) Nur die <b>Länge<\/b> zählt: längeres Pendel schwingt langsamer, das Gewicht spielt keine Rolle.<\/p><p>c) Der Stein fliegt <b>geradeaus<\/b> weiter (in Bewegungsrichtung), nicht nach aussen.<\/p>"}, {"d": "t5", "id": "e75", "f": "Wer hat es erfunden?<br>Glühbirne, Telefon, Fliessband, Batterie", "b": "<p>Glühbirne: <b>Thomas Alva Edison<\/b> (1879)<br>Telefon: <b>Alexander Graham Bell<\/b> (1876)<br>Fliessband: <b>Henry Ford<\/b> (1913, Autos)<br>Batterie: <b>Alessandro Volta<\/b> (1800)<\/p>"}, {"d": "t5", "id": "e76", "f": "Nach wem sind die Einheiten benannt?<br>Volt, Ampere, Ohm, Watt, Hertz", "b": "<p>Volt: Alessandro <b>Volta<\/b><br>Ampere: André-Marie <b>Ampère<\/b><br>Ohm: Georg Simon <b>Ohm<\/b><br>Watt: James <b>Watt<\/b> (Dampfmaschine)<br>Hertz: Heinrich <b>Hertz<\/b><\/p>"}, {"d": "t5", "id": "e77", "f": "Erde und Sonne:<br>Wie lange dauert eine Runde um die Sonne? Eine Drehung der Erde?", "b": "<p>Um die Sonne: <b>1 Jahr<\/b> (365 ¼ Tage, darum alle 4 Jahre ein Schaltjahr)<\/p><p>Drehung um sich selbst: <b>1 Tag<\/b> (24 h)<\/p><p>Mond um die Erde: etwa 1 Monat<\/p>"}, {"d": "t5", "id": "e78", "f": "Papierformat A4:<br>Wie gross? Wie gross sind A3 und A5?", "b": "<p>A4: <b>210 × 297 mm<\/b><br>A3: doppelt so gross, 297 × 420 mm<br>A5: halb so gross, 148 × 210 mm<\/p><p class='merke'>A4 einmal falten gibt A5.<\/p>"}, {"d": "t5", "id": "e79", "f": "Gewaltenteilung:<br>Wer macht Gesetze, wer regiert, wer richtet? Im Bund und im Aargau?", "b": "<table><tr><td><\/td><td><b>Bund<\/b><\/td><td><b>Aargau<\/b><\/td><\/tr><tr><td>Legislative<br>(Gesetze)<\/td><td>Parlament: National- und Ständerat<\/td><td>Grosser Rat<\/td><\/tr><tr><td>Exekutive<br>(regiert)<\/td><td>Bundesrat (7)<\/td><td>Regierungsrat (5)<\/td><\/tr><tr><td>Judikative<br>(Gerichte)<\/td><td>Bundesgericht<\/td><td>Obergericht<\/td><\/tr><\/table>"}, {"d": "t5", "id": "e80", "f": "Schweiz in Zahlen:<br>Kantone? Landessprachen? Bundesstadt? Einwohner?", "b": "<p><b>26<\/b> Kantone<br><b>4<\/b> Landessprachen: Deutsch, Französisch, Italienisch, Rätoromanisch<br>Bundesstadt: <b>Bern<\/b><br>Rund <b>9 Millionen<\/b> Einwohner<\/p><p>Aargau: Hauptort Aarau<\/p>"}, {"d": "t5", "id": "e81", "f": "Hauptstädte:<br>Finnland, Norwegen, Schweden, Dänemark, Österreich, Polen, Niederlande, Portugal", "b": "<p>Finnland: <b>Helsinki<\/b><br>Norwegen: <b>Oslo<\/b><br>Schweden: <b>Stockholm<\/b><br>Dänemark: <b>Kopenhagen<\/b><br>Österreich: <b>Wien<\/b><br>Polen: <b>Warschau<\/b><br>Niederlande: <b>Amsterdam<\/b><br>Portugal: <b>Lissabon<\/b><\/p>"}, {"d": "t5", "id": "e82", "f": "Internet zu Hause:<br>Router, WLAN, Glasfaser, www?", "b": "<p><b>Router<\/b>: verbindet das Heimnetz mit dem Internet.<br><b>WLAN<\/b>: Netzwerk über Funk.<br><b>DSL<\/b> über die Telefonleitung, <b>Glasfaser<\/b> mit Licht, viel schneller.<br><b>www<\/b>: World Wide Web<\/p><p class='merke'>Netzwerkkabel ziehen gehört auch zum Elektroinstallateur.<\/p>"}, {"d": "t5", "id": "e83", "f": "Elektroinstallateur/in EFZ:<br>Wie lange dauert die Lehre? Was macht man?", "b": "<p><b>4 Jahre<\/b>, 1 bis 2 Tage pro Woche Berufsfachschule, dazu überbetriebliche Kurse.<\/p><p>Installiert Strom, Licht, Steckdosen, Netzwerk und Telefon, Gebäudeautomation, Solaranlagen, Ladestationen.<\/p><p class='merke'>Berufsverband: EIT.swiss<\/p>"}, {"d": "t5", "id": "e84", "f": "Was gehört zur Schutzausrüstung auf der Baustelle?", "b": "<ul><li>Sicherheitsschuhe<\/li><li>Helm<\/li><li>Schutzbrille (Bohren, Spitzen)<\/li><li>Gehörschutz<\/li><li>Arbeitshandschuhe<\/li><li>Warnweste<\/li><\/ul>"}], DECKS=[["t0", "Lernen", "#6f7c88"], ["t1", "Elektro", "#d4a017"], ["t2", "Mathe", "#1f5f99"], ["t3", "Geometrie", "#138078"], ["t4", "Technik & Logik", "#c8651b"], ["t5", "Allgemeinwissen", "#6b4fa0"]], TITEL="Elektro Eignungstest";
const LS="lernapp-elektro-v1"; let st=JSON.parse(localStorage.getItem(LS)||"{}");
const save=()=>localStorage.setItem(LS,JSON.stringify(st));
const app=document.getElementById("app"), titel=document.getElementById("titel"), back=document.getElementById("zurueck"),
 home=document.getElementById("home");
const sicher=c=>(st[c.id]||{}).ok>=2&&!(st[c.id]||{}).last0, schwer=c=>(st[c.id]||{}).last0;
const farbe=d=>(DECKS.find(x=>x[0]===d)||[0,0,"#6b4fa0"])[2];
function deckKarten(d){return d==="alle"?K:d==="schwer"?K.filter(schwer):K.filter(c=>c.d===d)}
function zeile(d,n,c){const ks=deckKarten(d),s=ks.filter(sicher).length;
 return `<button class="deck" style="--c:${c}" onclick="start('${d}')"><b>${n}</b><small>${s} / ${ks.length} sicher</small></button>
 <div class="bar" style="--c:${c}"><i style="width:${ks.length?s/ks.length*100:0}%"></i></div>`}
function menu(){titel.textContent=TITEL;back.hidden=true;home.hidden=false;
 app.innerHTML=zeile("alle","Alles gemischt","#6b4fa0")+DECKS.map(([d,n,c])=>zeile(d,n,c)).join("")
 +(K.some(schwer)?zeile("schwer","Schwierige Kärtchen","#b8860b"):"")
 +`<p class="info">Antippen zeigt die Antwort. Sicher = zweimal hintereinander gewusst.</p>
 <button class="deck neutral" onclick="if(confirm('Lernstand löschen?')){st={};save();menu()}"><b>Lernstand zurücksetzen</b></button>`}
let stapel=[],idx=0,erst={};
function mischen(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(d,liste){back.hidden=false;home.hidden=true;
 titel.textContent=d==="alle"?"Alles gemischt":d==="schwer"?"Schwierige Kärtchen":(DECKS.find(x=>x[0]===d)||[0,"Fehler üben"])[1];
 let ks=mischen([...(liste||deckKarten(d))]);ks.sort((a,b)=>sicher(a)-sicher(b));
 stapel=ks;idx=0;erst={};zeige(false)}
function zeige(offen){if(idx>=stapel.length)return ende();
 const c=stapel[idx];
 let h=`<p class="info">noch ${stapel.length-idx} Kärtchen</p><div class="card" style="--c:${farbe(c.d)}" onclick="zeige(true)">
 <span class="tag">${(DECKS.find(x=>x[0]===c.d)||[0,""])[1]}</span><div class="vorne">${c.f}</div>`;
 h+=offen?`<div class="trenn"></div><div class="hinten">${c.b}</div>`:`<div class="hint">tippen zum Umdrehen</div>`;
 h+="</div>";
 if(offen)h+=`<div class="btns"><button class="nein" onclick="antwort(false)">Nochmals</button><button class="ja" onclick="antwort(true)">Gewusst</button></div>`;
 app.innerHTML=h;window.scrollTo(0,0)}
function antwort(ok){const c=stapel[idx],s=st[c.id]||(st[c.id]={ok:0,nok:0});
 if(!(c.id in erst))erst[c.id]=ok;
 if(ok){s.ok++;s.last0=false}else{s.nok++;s.last0=true;s.ok=0;stapel.splice(Math.min(idx+4,stapel.length),0,c)}
 save();idx++;zeige(false)}
function ende(){const ids=Object.keys(erst),gut=ids.filter(i=>erst[i]).length,falsch=K.filter(c=>erst[c.id]===false);
 app.innerHTML=`<div class="card end"><div>Beim ersten Versuch gewusst</div><div class="gross">${gut} / ${ids.length}</div>
 <div>${falsch.length?falsch.length+" Kärtchen waren schwierig":"Alles auf Anhieb!"}</div></div>
 <div class="btns">${falsch.length?`<button class="nein" onclick="start('fehler',K.filter(c=>erst[c.id]===false))">Fehler üben</button>`:""}
 <button class="grau" onclick="menu()">Menü</button></div>`}
back.onclick=menu;menu();
</script></body></html>
